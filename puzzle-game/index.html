<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>과일 메모리 퍼즐</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="game">
    <section class="game-header">
      <div>
        <h1>과일 메모리 퍼즐</h1>
        <p>6x6 보드에서 같은 과일 카드 2장을 찾아보세요.</p>
      </div>
      <button id="restart-button" type="button">다시 시작</button>
    </section>

    <section class="status" aria-live="polite">
      <span>시도 횟수: <strong id="try-count">0</strong></span>
      <span>찾은 짝: <strong id="match-count">0</strong> / <strong id="match-total">0</strong></span>
      <span>경과 시간: <strong id="time-count">0</strong>초</span>
      <span id="message">카드 2장을 선택하세요.</span>
    </section>

    <section id="game-board" class="game-board" aria-label="과일 메모리 퍼즐 보드"></section>
  </main>

  <script src="js/utils.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
